[package]
name = "save-my-eyes"
version = "0.3.0"
description = "App that helps you protect your eyes while working long hours on a computer"
authors = ["Ammadeo"]
license = "GPL-3.0"
repository = "https://github.com/ammadeo/save-my-eyes"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "save_my_eyes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std", "NSResponder", "NSWindow",
  # spike only:
  "NSApplication", "NSEvent", "NSGraphicsContext", "NSMenu", "NSMenuItem",
] }
# Phase 0 spike only (synthetic Cmd+W in src/spike.rs); drop with the spike.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSArray"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
